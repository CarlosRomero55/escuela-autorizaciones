{% extends "admin/base.html" %}
{% block titulo %}Segundo factor{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Código de verificación</h1>
  <p>Abra su aplicación de autenticación y escriba el código de 6 dígitos.</p>
  {% if error %}<p class="aviso error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/totp" class="formulario">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Código
      <input name="codigo" required inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code">
    </label>
    <button type="submit" class="boton">Verificar</button>
  </form>
</section>
{% endblock %}
