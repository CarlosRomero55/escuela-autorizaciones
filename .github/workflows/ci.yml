name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escuela
          POSTGRES_PASSWORD: escuela_dev
          POSTGRES_DB: escuela_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U escuela -d escuela_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Pruebas (SQLite y PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://escuela:escuela_dev@localhost:5432/escuela_test
        run: pytest -q
